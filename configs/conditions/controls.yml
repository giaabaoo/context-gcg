- {match: "carry/*/unchanged", items: mask, layout: doc_tight, slot: suffix, batch: 16, max_new: 256,
   src: scripts/run_mask_control.py}
- {match: "carry/*/masked", items: mask, passage: passage_masked, layout: doc_tight, slot: suffix, batch: 16,
   max_new: 256, src: scripts/run_mask_control.py}
- {match: "carry/*/masked_nosuffix", items: mask, passage: passage_masked, layout: doc_tight, slot: none,
   batch: 16, max_new: 256, src: scripts/run_mask_control.py}
- {match: "carry/*/substituted", items: mask, passage: passage_substituted, layout: doc_tight, slot: suffix,
   batch: 16, max_new: 256, src: scripts/run_mask_control.py}
- {match: "carry/*/substituted_nosuffix", items: mask, passage: passage_substituted, layout: doc_tight,
   slot: none, batch: 16, max_new: 256, src: scripts/run_mask_control.py}
- {match: "carry/*/deleted", regen: false,
   why: "uses an earlier run's suffixes (suffix_src); 48-token decode, scripts/swap_drop_clean.py"}
- {match: "swap/*/*", regen: false,
   why: "uses an earlier run's suffixes (suffix_src); 48-token decode, scripts/swap_drop_clean.py"}
