   slot_from_name: true, src: scripts/run_expB.py}
- {match: "domain/*/noprior_*", items: domain_noprior, layout: doc_tight, batch: 8, max_new: 192,
   slot_from_name: true, src: scripts/run_expC.py}
- {match: "domain/*/new_*", items: domain_new, layout: doc_tight, batch: 8, max_new: 192,
   slot_from_name: true, src: scripts/run_expD.py}
